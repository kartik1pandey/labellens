<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Georgia, serif">
  <rect width="960" height="600" fill="#EDF0DF"/>
  <line x1="0" y1="56" x2="960" y2="56" stroke="rgba(27,42,34,.14)"/>
  <text x="36" y="34" font-size="19" fill="#1B2A22" font-weight="600">LabelLens</text>

  <g transform="translate(230,0)">
  <text x="0" y="106" font-size="26" fill="#1B2A22" font-weight="600">Your journal</text>
  <text x="0" y="128" font-size="12.5" fill="#1B2A22B3" font-family="Arial, sans-serif">Every scan you log, tracked against daily limits.</text>

  <!-- today cards -->
  <g font-family="Arial, sans-serif">
    <rect x="0" y="152" width="150" height="92" rx="14" fill="#F6F7EE" stroke="rgba(27,42,34,.14)"/>
    <text x="16" y="176" font-size="11" fill="#1B2A2273" font-weight="600">Sugar today</text>
    <text x="16" y="206" font-size="21" fill="#1B2A22" font-family="Georgia, serif">32<tspan font-size="12" fill="#1B2A2273" font-family="Arial, sans-serif">/50g</tspan></text>
    <text x="96" y="204" font-size="10.5" fill="#9E3324" font-weight="700">↑ 12%</text>
    <rect x="16" y="222" width="118" height="7" rx="4" fill="#E3E7D2"/><rect x="16" y="222" width="76" height="7" rx="4" fill="#A9760F"/>

    <rect x="164" y="152" width="150" height="92" rx="14" fill="#F6F7EE" stroke="rgba(27,42,34,.14)"/>
    <text x="180" y="176" font-size="11" fill="#1B2A2273" font-weight="600">Sodium today</text>
    <text x="180" y="206" font-size="21" fill="#1B2A22" font-family="Georgia, serif">640<tspan font-size="12" fill="#1B2A2273" font-family="Arial, sans-serif">/2000mg</tspan></text>
    <text x="278" y="204" font-size="10.5" fill="#3F6C4C" font-weight="700">↓ 8%</text>
    <rect x="180" y="222" width="118" height="7" rx="4" fill="#E3E7D2"/><rect x="180" y="222" width="38" height="7" rx="4" fill="#3F6C4C"/>

    <rect x="328" y="152" width="150" height="92" rx="14" fill="#F6F7EE" stroke="rgba(27,42,34,.14)"/>
    <text x="344" y="176" font-size="11" fill="#1B2A2273" font-weight="600">Sat. fat today</text>
    <text x="344" y="206" font-size="21" fill="#1B2A22" font-family="Georgia, serif">19<tspan font-size="12" fill="#1B2A2273" font-family="Arial, sans-serif">/22g</tspan></text>
    <rect x="344" y="222" width="118" height="7" rx="4" fill="#E3E7D2"/><rect x="344" y="222" width="102" height="7" rx="4" fill="#A9760F"/>
  </g>

  <!-- chart card -->
  <rect x="0" y="270" width="478" height="150" rx="14" fill="#F6F7EE" stroke="rgba(27,42,34,.14)"/>
  <text x="20" y="298" font-size="14" fill="#1B2A22" font-family="Arial, sans-serif" font-weight="700">Last 7 days</text>
  <g fill="#3F6C4C">
    <rect x="34" y="350" width="30" height="40" rx="5"/>
    <rect x="88" y="330" width="30" height="60" rx="5"/>
    <rect x="142" y="360" width="30" height="30" rx="5"/>
    <rect x="196" y="320" width="30" height="70" rx="5"/>
    <rect x="250" y="345" width="30" height="45" rx="5"/>
    <rect x="304" y="310" width="30" height="80" rx="5"/>
    <rect x="358" y="335" width="30" height="55" rx="5"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="10.5" fill="#1B2A2273">
    <text x="49" y="404" text-anchor="middle">Mon</text><text x="103" y="404" text-anchor="middle">Tue</text>
    <text x="157" y="404" text-anchor="middle">Wed</text><text x="211" y="404" text-anchor="middle">Thu</text>
    <text x="265" y="404" text-anchor="middle">Fri</text><text x="319" y="404" text-anchor="middle">Sat</text>
    <text x="373" y="404" text-anchor="middle">Sun</text>
  </g>

  <!-- history -->
  <text x="0" y="450" font-size="14" fill="#1B2A22" font-family="Arial, sans-serif" font-weight="700">History</text>
  <g font-family="Arial, sans-serif">
    <line x1="0" y1="464" x2="478" y2="464" stroke="rgba(27,42,34,.14)"/>
    <text x="0" y="490" font-size="13" fill="#1B2A22" font-weight="600">Ravva Ladoo</text>
    <text x="0" y="506" font-size="10.5" fill="#1B2A2273">Sep 20 · 10:12 AM</text>
    <circle cx="440" cy="493" r="4.5" fill="#9E3324"/><circle cx="455" cy="493" r="4.5" fill="#3F6C4C"/><circle cx="470" cy="493" r="4.5" fill="#A9760F"/>

    <line x1="0" y1="518" x2="478" y2="518" stroke="rgba(27,42,34,.14)"/>
    <text x="0" y="544" font-size="13" fill="#1B2A22" font-weight="600">Masala Oats</text>
    <text x="0" y="560" font-size="10.5" fill="#1B2A2273">Sep 19 · 8:47 PM</text>
    <circle cx="440" cy="547" r="4.5" fill="#3F6C4C"/><circle cx="455" cy="547" r="4.5" fill="#3F6C4C"/><circle cx="470" cy="547" r="4.5" fill="#3F6C4C"/>
  </g>
  </g>
</svg>
