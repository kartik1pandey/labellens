<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Georgia, serif">
  <rect width="960" height="600" fill="#EDF0DF"/>
  <rect width="960" height="56" fill="#EDF0DF"/>
  <line x1="0" y1="56" x2="960" y2="56" stroke="rgba(27,42,34,.14)"/>
  <text x="36" y="34" font-size="19" fill="#1B2A22" font-weight="600">LabelLens</text>
  <rect x="700" y="16" width="60" height="26" rx="13" fill="#1B2A22"/>
  <text x="730" y="34" font-size="12" fill="#EDF0DF" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600">Home</text>
  <text x="800" y="34" font-size="12" fill="#1B2A2280" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600">Scan</text>
  <text x="880" y="34" font-size="12" fill="#1B2A2280" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600">Journal</text>

  <text x="36" y="150" font-size="42" fill="#1B2A22" font-weight="500">Know what's really</text>
  <text x="36" y="196" font-size="42" fill="#1B2A22" font-weight="500">inside the packet.</text>
  <text x="36" y="234" font-size="15" fill="#1B2A22B3" font-family="Arial, sans-serif">Scan the back of any packaged food. LabelLens reads the</text>
  <text x="36" y="256" font-size="15" fill="#1B2A22B3" font-family="Arial, sans-serif">ingredients and nutrition panel in seconds, not a squint.</text>
  <rect x="36" y="284" width="150" height="46" rx="23" fill="#1B2A22"/>
  <text x="111" y="312" font-size="14" fill="#EDF0DF" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600">Scan a label</text>

  <!-- hero art: packet + flags -->
  <rect x="560" y="90" width="190" height="230" rx="14" fill="#F6F7EE" stroke="rgba(27,42,34,.28)" stroke-width="1.5"/>
  <text x="580" y="120" font-size="10" fill="#1B2A2273" font-family="Arial, sans-serif" font-weight="800" letter-spacing="1">INGREDIENTS</text>
  <rect x="580" y="134" width="130" height="6" rx="3" fill="rgba(27,42,34,.28)"/>
  <rect x="580" y="148" width="150" height="6" rx="3" fill="rgba(27,42,34,.28)"/>
  <rect x="580" y="162" width="100" height="6" rx="3" fill="rgba(27,42,34,.28)"/>
  <rect x="580" y="176" width="120" height="6" rx="3" fill="rgba(27,42,34,.28)"/>
  <rect x="580" y="190" width="75" height="6" rx="3" fill="rgba(27,42,34,.28)"/>

  <rect x="700" y="150" width="150" height="34" rx="10" fill="#F1DAD3"/>
  <text x="716" y="171" font-size="12" fill="#9E3324" font-family="Arial, sans-serif" font-weight="700">⚠ High sugar</text>
  <rect x="700" y="192" width="150" height="34" rx="10" fill="#F3E7CC"/>
  <text x="716" y="213" font-size="12" fill="#A9760F" font-family="Arial, sans-serif" font-weight="700">● Moderate salt</text>
  <rect x="700" y="234" width="170" height="34" rx="10" fill="#E1EADD"/>
  <text x="716" y="255" font-size="12" fill="#3F6C4C" font-family="Arial, sans-serif" font-weight="700">✓ FSSAI format OK</text>

  <line x1="36" y1="380" x2="924" y2="380" stroke="rgba(27,42,34,.14)"/>
  <text x="36" y="410" font-size="13" fill="#1B2A22B3" font-family="Arial, sans-serif">Nutrient flags follow <tspan font-weight="700" fill="#1B2A22">WHO daily-limit guidance</tspan> for sugar, sodium and saturated fat.</text>
  <line x1="36" y1="440" x2="924" y2="440" stroke="rgba(27,42,34,.14)"/>

  <text x="36" y="490" font-size="24" fill="#1B2A22" font-weight="600">From packet to plain answer</text>
  <g font-family="Arial, sans-serif">
    <line x1="36" y1="516" x2="316" y2="516" stroke="#1B2A22" stroke-width="2.5"/>
    <text x="36" y="546" font-size="26" fill="#1B2A2273">01</text>
    <text x="36" y="572" font-size="14" fill="#1B2A22" font-weight="700">Photograph the back</text>

    <line x1="356" y1="516" x2="636" y2="516" stroke="#1B2A22" stroke-width="2.5"/>
    <text x="356" y="546" font-size="26" fill="#1B2A2273">02</text>
    <text x="356" y="572" font-size="14" fill="#1B2A22" font-weight="700">Get a real read</text>

    <line x1="676" y1="516" x2="924" y2="516" stroke="#1B2A22" stroke-width="2.5"/>
    <text x="676" y="546" font-size="26" fill="#1B2A2273">03</text>
    <text x="676" y="572" font-size="14" fill="#1B2A22" font-weight="700">Log it, see the pattern</text>
  </g>
</svg>
